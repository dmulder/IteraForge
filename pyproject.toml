[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iteraforge"
version = "0.1.0"
description = "Local-first workplace task-helper platform with isolated generated tabs."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.5",
]

[project.scripts]
iteraforge = "iteraforge.main:main"
iteraforge-improve = "iteraforge.improve:main"
iteraforge-agent-worker = "iteraforge.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iteraforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
